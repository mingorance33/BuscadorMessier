<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Messier (M1-M110) - Cuadrantes Trípode 0°-90°</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151b23;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --highlight: #3fb950;
      --warn: #8b949e;
      --dial: #f0883e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 16px auto;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 1.35rem;
      color: #fff;
    }
    .alignment-note {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .controls {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 0.85rem;
      color: #8b949e;
    }
    .search-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    input[type="text"] {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      flex-grow: 1;
      font-size: 0.9rem;
    }
    .filter-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: #c9d1d9;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filter-btn.active {
      background: #1f6feb;
      border-color: #388bfd;
      color: #fff;
    }
    button.gps-btn {
      background: #238636;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
    }
    .card-type {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 600;
    }
    .tripod-target {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin: 4px 0;
    }
    .tripod-label {
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tripod-value {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--dial);
      margin: 2px 0;
    }
    .tripod-sector {
      font-size: 0.85rem;
      color: var(--highlight);
      font-weight: 500;
    }
    .card-meta {
      font-size: 0.82rem;
      color: #8b949e;
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }
    .below-horizon {
      opacity: 0.4;
    }
    .below-horizon .tripod-value {
      color: var(--warn);
    }
  </style>
</head>

    function requestGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
          document.getElementById('coords-display').innerText = 
            `Lat: ${userLat.toFixed(2)}°, Lon: ${userLon.toFixed(2)}° (GPS)`;
          renderCatalog();
        }, () => {
          alert("No se pudo obtener el GPS.");
        });
      }
    }

    function toggleOnlyVisible() {
      onlyVisible = !onlyVisible;
      const btn = document.getElementById('toggle-visible');
      btn.classList.toggle('active', onlyVisible);
      btn.innerText = onlyVisible ? "Solo Visibles" : "Mostrar Todos";
      renderCatalog();
    }

    function getLST(now, lon) {
      const jd = (now.getTime() / 86400000) + 2440587.5;
      const d = jd - 2451545.0;
      let gmst = 18.697374558 + 24.06570982441908 * d;
      gmst = ((gmst % 24) + 24) % 24;
      let lst = gmst + (lon / 15.0);
      return ((lst % 24) + 24) % 24;
    }

    function raDecToAltAz(ra, dec, lat, lst) {
      const d2r = Math.PI / 180;
      const r2d = 180 / Math.PI;

      let ha = (lst - ra) * 15.0;
      ha = ((ha % 360) + 360) % 360;

      const phi = lat * d2r;
      const delta = dec * d2r;
      const H = ha * d2r;

      const sinAlt = Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(H);
      const alt = Math.asin(sinAlt);

      const cosAz = (Math.sin(delta) - Math.sin(phi) * Math.sin(alt)) / (Math.cos(phi) * Math.cos(alt));
      let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) * r2d;
      if (Math.sin(H) > 0) az = 360 - az;

      return { az: az, alt: alt * r2d };
    }

    // Conversión matemática para trípode alineado con 0° al Norte
    function formatTripodQuadrant(az) {
      let sectorName = "";
      let dialDeg = 0;

      if (az >= 0 && az < 90) {
        dialDeg = az;
        sectorName = "Norte ➔ Este (1er sector)";
      } else if (az >= 90 && az < 180) {
        dialDeg = az - 90;
        sectorName = "Este ➔ Sur (2º sector)";
      } else if (az >= 180 && az < 270) {
        dialDeg = az - 180;
        sectorName = "Sur ➔ Oeste (3er sector)";
      } else {
        dialDeg = az - 270;
        sectorName = "Oeste ➔ Norte (4º sector)";
      }

      return {
        dialValue: `${dialDeg.toFixed(1)}°`,
        sector: sectorName,
        az360: az.toFixed(1)
      };
    }

    function renderCatalog() {
      const now = new Date();
      document.getElementById('time-display').innerText = now.toLocaleTimeString();

      const lst = getLST(now, userLon);
      const container = document.getElementById('catalog-container');
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      container.innerHTML = "";

      MESSIER_DATA.forEach(obj => {
        const matchSearch = obj.id.toLowerCase().includes(query) || 
                            obj.name.toLowerCase().includes(query) || 
                            obj.con.toLowerCase().includes(query);
        if (!matchSearch) return;

        const { az, alt } = raDecToAltAz(obj.ra, obj.dec, userLat, lst);
        const isVisible = alt > 0;

        if (onlyVisible && !isVisible) return;

        const tripod = formatTripodQuadrant(az);

        const card = document.createElement('div');
        card.className = `card ${!isVisible ? 'below-horizon' : ''}`;
        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${obj.id}</span>
            <span class="card-type">${obj.con} &bull; ${obj.type}</span>
          </div>
          ${obj.name ? `<div style="font-size: 0.92rem; font-weight: 500; color: #fff;">${obj.name}</div>` : ''}
          
          <div class="tripod-target">
            <div class="tripod-label">Poner Trípode en:</div>
            <div class="tripod-value">${tripod.dialValue}</div>
            <div class="tripod-sector">${tripod.sector}</div>
          </div>

          <div class="card-meta">
            <span>Altitud: <strong>${alt.toFixed(1)}°</strong></span>
            <span>Az real: <strong>${tripod.az360}°</strong></span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    renderCatalog();
    setInterval(renderCatalog, 5000);
  </script>
</body>
</html>
