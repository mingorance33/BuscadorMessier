<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Localizador Celeste - Horizontal Calibrado</title>
  
  <!-- Motor de efemérides astronómicas de alta precisión -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

  <style>
    :root {
      --bg: #070b12;
      --card-bg: #0f1724;
      --border: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --orange: #f97316;
      --yellow: #facc15;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 12px;
      overflow-x: hidden;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 12px;
      align-items: stretch;
    }

    /* Columna Izquierda: Controles y Datos */
    .col-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: space-between;
    }

    /* Columna Derecha: Brújula e Indicador de Tiro */
    .col-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }

    .header-box {
      text-align: left;
    }

    h1 {
      color: var(--accent);
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .btn-action {
      width: 100%;
      background: var(--accent);
      color: #031326;
      border: none;
      padding: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .status-gps {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .label-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .segmented-control {
      display: flex;
      background: #090d16;
      border-radius: 6px;
      padding: 2px;
      border: 1px solid #334155;
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .seg-btn.active {
      background: #0284c7;
      color: #fff;
    }

    select {
      width: 100%;
      background: #090d16;
      color: #fff;
      border: 1px solid #334155;
      padding: 6px 8px;
      font-size: 0.82rem;
      border-radius: 6px;
      outline: none;
    }

    optgroup {
      background: #0f1724;
      color: var(--accent);
      font-weight: 700;
    }

    option {
      background: #090d16;
      color: #fff;
    }

    /* Brújula */
    .compass-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto;
    }

    .compass-dial {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #0b111e 60%, #070b12 100%);
      border: 2px solid #334155;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      position: relative;
      transition: transform 0.08s linear;
    }

    .compass-tick {
      position: absolute;
      width: 2px;
      height: 8px;
      background: #475569;
      left: calc(50% - 1px);
      top: 4px;
      transform-origin: 50% 76px;
    }

    .compass-label {
      position: absolute;
      width: 16px;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-align: center;
      left: calc(50% - 8px);
    }

    .compass-label.north { top: 14px; color: var(--red); }
    .compass-label.east { right: 14px; left: auto; top: calc(50% - 6px); }
    .compass-label.south { bottom: 14px; left: calc(50% - 8px); }
    .compass-label.west { left: 14px; top: calc(50% - 6px); }

    .compass-needle-fixed {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 12px solid var(--accent);
      z-index: 10;
    }

    .target-pointer {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      transform-origin: center center;
    }

    .target-dot {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: var(--orange);
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 8px var(--orange);
    }

    .compass-center-info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .heading-val {
      font-size: 1.35rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .heading-unit {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .info-summary {
      display: flex;
      justify-content: space-around;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }

    .info-col-label {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .info-col-val {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent);
    }

    .info-col-val.target-color {
      color: var(--orange);
    }

    .target-banner {
      background: #111827;
      border: 1px solid #1f2937;
      color: var(--yellow);
      text-align: center;
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }

    .target-banner.aligned {
      background: #14532d;
      border-color: #22c55e;
      color: #86efac;
    }

    @media (orientation: portrait) {
      .container {
        grid-template-columns: 1fr;
      }
      .compass-wrapper {
        width: 190px;
        height: 190px;
      }
      .compass-tick {
        transform-origin: 50% 91px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- COLUMNA IZQUIERDA -->
    <div class="col-left">
      <div class="panel header-box">
        <h1>Localizador Celeste</h1>
        <div class="subtitle">Modo Horizontal (Compensación 3D)</div>
      </div>

      <div class="panel">
        <button class="btn-action" id="btn-activate" onclick="startApp()">Activar Brújula y Sensores</button>
        <div class="status-gps" id="gps-status">Esperando activación...</div>
      </div>

      <div class="panel">
        <div class="filter-row">
          <span class="label-title">Objetivo:</span>
          <div class="segmented-control">
            <button class="seg-btn active" id="btn-vis" onclick="setFilter(true)">Visibles</button>
            <button class="seg-btn" id="btn-all" onclick="setFilter(false)">Todos</button>
          </div>
        </div>
        <select id="object-select" onchange="updateCalculations()"></select>
      </div>

      <div class="info-summary panel">
        <div>
          <div class="info-col-label">Objeto (Az / Alt)</div>
          <div class="info-col-val target-color" id="disp-target-coords">--° / --°</div>
        </div>
        <div>
          <div class="info-col-label">Inclinación</div>
          <div class="info-col-val" id="disp-sensor-pitch">--°</div>
        </div>
        <div>
          <div class="info-col-label">Giro Requerido</div>
          <div class="info-col-val" id="disp-turn">--°</div>
        </div>
      </div>
    </div>

    <!-- COLUMNA DERECHA -->
    <div class="col-right">
      <div class="panel" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div class="compass-wrapper">
          <div class="compass-needle-fixed"></div>

          <div class="compass-dial" id="compass-dial">
            <div class="compass-label north">N</div>
            <div class="compass-label east">E</div>
            <div class="compass-label south">S</div>
            <div class="compass-label west">O</div>

            <div class="target-pointer" id="target-pointer">
              <div class="target-dot" title="Posición del Objeto"></div>
            </div>
          </div>

          <div class="compass-center-info">
            <div class="heading-val" id="disp-heading">--°</div>
            <div class="heading-unit" id="disp-cardinal-dir">RUMBO</div>
          </div>
        </div>

        <div class="target-banner" id="banner-status" style="width: 100%;">ACTIVA SENSORES</div>
      </div>
    </div>
  </div>

      { id: "M98", name: "Galaxia espiral", con: "Com", ra: 12.230, dec: 14.90 },
      { id: "M99", name: "Galaxia espiral", con: "Com", ra: 12.314, dec: 14.42 },
      { id: "M100", name: "Galaxia espiral", con: "Com", ra: 12.382, dec: 15.82 },
      { id: "M101", name: "Galaxia del Molinillo", con: "UMa", ra: 14.053, dec: 54.35 },
      { id: "M102", name: "Galaxia del Huso", con: "Dra", ra: 15.110, dec: 55.76 },
      { id: "M103", name: "Cúmulo abierto", con: "Cas", ra: 1.553, dec: 60.70 },
      { id: "M104", name: "Galaxia del Sombrero", con: "Vir", ra: 12.666, dec: -11.62 },
      { id: "M105", name: "Galaxia elíptica", con: "Leo", ra: 10.797, dec: 12.58 },
      { id: "M106", name: "Galaxia espiral", con: "CVn", ra: 12.316, dec: 47.30 },
      { id: "M107", name: "Cúmulo globular", con: "Oph", ra: 16.542, dec: -13.05 },
      { id: "M108", name: "Galaxia espiral", con: "UMa", ra: 11.192, dec: 55.67 },
      { id: "M109", name: "Galaxia espiral", con: "UMa", ra: 11.960, dec: 53.37 },
      { id: "M110", name: "Satélite de Andrómeda", con: "And", ra: 0.673, dec: 41.68 }
    ];

    let userLat = 37.18;
    let userLon = -5.78;
    let userElevation = 0;
    let onlyVisible = true;
    let currentAzTarget = null;
    let currentAltTarget = null;
    let currentCompassHeading = null;
    let currentSensorPitch = null;
    let audioCtx = null;
    let lastBeep = 0;

    function getTargetAltAz(targetId, date, lat, lon, elev) {
      if (typeof Astronomy !== 'undefined') {
        const observer = new Astronomy.Observer(lat, lon, elev);
        if (targetId.startsWith("PLANET_")) {
          const bodyKey = targetId.replace("PLANET_", "");
          const equ2000 = Astronomy.Equator(bodyKey, date, observer, true, true);
          const hor = Astronomy.Horizon(date, observer, equ2000.ra, equ2000.dec, 'normal');
          return { az: hor.azimuth, alt: hor.altitude };
        }
        if (targetId.startsWith("STAR_")) {
          const star = BRIGHT_STARS_DATA.find(s => s.id === targetId);
          if (star) {
            const hor = Astronomy.Horizon(date, observer, star.ra, star.dec, 'normal');
            return { az: hor.azimuth, alt: hor.altitude };
          }
        }
        const obj = MESSIER_DATA.find(o => o.id === targetId);
        if (obj) {
          const hor = Astronomy.Horizon(date, observer, obj.ra, obj.dec, 'normal');
          return { az: hor.azimuth, alt: hor.altitude };
        }
      }
      return { az: 0, alt: -90 };
    }

    function buildCompassTicks() {
      const dial = document.getElementById('compass-dial');
      for (let i = 0; i < 360; i += 30) {
        if (i % 90 === 0) continue;
        const tick = document.createElement('div');
        tick.className = 'compass-tick';
        tick.style.transform = `rotate(${i}deg)`;
        dial.appendChild(tick);
      }
    }

    function populateSelect() {
      const select = document.getElementById('object-select');
      const prevSelected = select.value;
      select.innerHTML = "";
      const now = new Date();

      const groups = [
        { label: "⭐ Estrellas Guía y Calibración", data: BRIGHT_STARS_DATA },
        { label: "🪐 Planetas y Luna", data: SOLAR_SYSTEM_DATA },
        { label: "🌌 Catálogo Messier", data: MESSIER_DATA }
      ];

      groups.forEach(g => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = g.label;
        g.data.forEach(item => {
          const { alt } = getTargetAltAz(item.id, now, userLat, userLon, userElevation);
          if (onlyVisible && alt <= 0) return;
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = `${item.name || item.id} (${alt > 0 ? '+' : ''}${alt.toFixed(0)}°)`;
          optgroup.appendChild(opt);
        });
        if (optgroup.children.length > 0) select.appendChild(optgroup);
      });

      if (prevSelected && Array.from(select.options).some(o => o.value === prevSelected)) {
        select.value = prevSelected;
      }
      updateCalculations();
    }

    function setFilter(visibleOnly) {
      onlyVisible = visibleOnly;
      document.getElementById('btn-vis').classList.toggle('active', visibleOnly);
      document.getElementById('btn-all').classList.toggle('active', !visibleOnly);
      populateSelect();
    }

    function updateCalculations() {
      const select = document.getElementById('object-select');
      if (!select.value) return;
      const now = new Date();
      const { az, alt } = getTargetAltAz(select.value, now, userLat, userLon, userElevation);
      currentAzTarget = az;
      currentAltTarget = alt;
      document.getElementById('disp-target-coords').textContent = `${az.toFixed(1)}° / ${alt.toFixed(1)}°`;
      document.getElementById('target-pointer').style.transform = `rotate(${az}deg)`;
      checkAlignment();
    }

    function getCardinalLabel(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
      return dirs[Math.round(deg / 45) % 8];
    }

    function playBeep(freq, duration) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function checkAlignment() {
      const banner = document.getElementById('banner-status');
      if (currentAzTarget === null || currentAltTarget === null || currentCompassHeading === null || currentSensorPitch === null) {
        banner.textContent = "APUNTA EL MÓVIL";
        banner.classList.remove('aligned');
        return;
      }

      let diffAz = (currentAzTarget - currentCompassHeading + 540) % 360 - 180;
      let diffAlt = currentAltTarget - currentSensorPitch;

      const absDiffAz = Math.abs(diffAz);
      const absDiffAlt = Math.abs(diffAlt);

      const turnLabel = diffAz > 0 ? `➔ Der ${absDiffAz.toFixed(1)}°` : `⬅ Izq ${absDiffAz.toFixed(1)}°`;
      document.getElementById('disp-turn').textContent = turnLabel;

      const now = Date.now();

      if (absDiffAz <= 2.5 && absDiffAlt <= 2.0) {
        banner.textContent = "¡EN EL BLANCO! (ALINEADO)";
        banner.classList.add('aligned');
        if (now - lastBeep > 250) {
          playBeep(880, 0.15);
          lastBeep = now;
        }
      } else {
        banner.classList.remove('aligned');
        let instructions = [];
        if (absDiffAz > 2.5) {
          instructions.push(diffAz > 0 ? `DER (${absDiffAz.toFixed(1)}°)` : `IZQ (${absDiffAz.toFixed(1)}°)`);
        }
        if (absDiffAlt > 2.0) {
          instructions.push(diffAlt > 0 ? `SUBE (+${diffAlt.toFixed(1)}°)` : `BAJA (${diffAlt.toFixed(1)}°)`);
        }
        banner.textContent = instructions.join(" | ");

        const combinedDiff = Math.sqrt(absDiffAz * absDiffAz + absDiffAlt * absDiffAlt);
        if (combinedDiff < 10.0 && now - lastBeep > (combinedDiff * 70 + 80)) {
          playBeep(440, 0.05);
          lastBeep = now;
        }
      }
    }

    // GESTIÓN DE ORIENTACIÓN CON PROYECCIÓN VECTORIAL 3D
    function handleOrientation(event) {
      let screenAngle = 0;
      if (window.screen && window.screen.orientation) {
        screenAngle = window.screen.orientation.angle || 0;
      } else if (typeof window.orientation !== 'undefined') {
        screenAngle = window.orientation;
      }

      // Rumbo en azimut compensado por la rotación de pantalla
      let heading = null;
      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        heading = (event.webkitCompassHeading + screenAngle) % 360;
      } else if (event.alpha !== null) {
        heading = ((360 - event.alpha) + screenAngle) % 360;
      }

      if (heading !== null) {
        currentCompassHeading = heading;
        document.getElementById('disp-heading').textContent = `${Math.round(heading)}°`;
        document.getElementById('disp-cardinal-dir').textContent = getCardinalLabel(heading);
        document.getElementById('compass-dial').style.transform = `rotate(${-heading}deg)`;
      }

      // Proyección vectorial 3D de la gravedad terrestre
      const betaRad = (event.beta || 0) * (Math.PI / 180);
      const gammaRad = (event.gamma || 0) * (Math.PI / 180);

      const x = Math.cos(betaRad) * Math.sin(gammaRad);
      const y = Math.sin(betaRad);
      const z = Math.cos(betaRad) * Math.cos(gammaRad);

      let pitch = 0;

      // Detección de orientación apaisada
      if (Math.abs(screenAngle) === 90 || screenAngle === 270) {
        const sign = screenAngle === 90 ? 1 : -1;
        pitch = Math.atan2(sign * x, Math.sqrt(y * y + z * z)) * (180 / Math.PI);
      } else {
        pitch = Math.atan2(y, Math.sqrt(x * x + z * z)) * (180 / Math.PI);
      }

      currentSensorPitch = pitch;
      document.getElementById('disp-sensor-pitch').textContent = `${pitch.toFixed(1)}°`;

      checkAlignment();
    }

    function startApp() {
      const btn = document.getElementById('btn-activate');

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
              btn.textContent = "Sensores Activos ✓";
              btn.style.background = "#22c55e";
            }
          })
          .catch(err => alert("Error sensor: " + err));
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
        btn.textContent = "Sensores Activos ✓";
        btn.style.background = "#22c55e";
      }

      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
          userElevation = pos.coords.altitude || 0;
          document.getElementById('gps-status').textContent = `GPS: ${userLat.toFixed(2)}°, ${userLon.toFixed(2)}°`;
          populateSelect();
        }, () => {
          document.getElementById('gps-status').textContent = `Ubicación por defecto activa`;
        });
      }
    }

    buildCompassTicks();
    populateSelect();
    setInterval(updateCalculations, 3000);
  </script>
</body>
