<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Buscador Messier - Nombres y Calibración</title>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131d31;
      --border: #334155;
      --accent: #38bdf8;
      --green: #00e676;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 12px;
      margin: 0;
      box-sizing: border-box;
    }
    h1 { font-size: 19px; color: var(--accent); margin: 6px 0 12px 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    label { font-size: 12px; color: var(--subtext); display: block; margin-bottom: 4px; text-align: left; }
    select, button {
      padding: 9px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #090d16;
      color: var(--text);
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      cursor: pointer;
      border: none;
      margin-top: 5px;
    }
    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 13px;
      padding: 7px;
    }
    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }
    .coord-box {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 4px;
    }
    .coord-box .title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--subtext);
      margin-bottom: 3px;
    }
    .coord-box .val {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
    }
    .readout {
      font-size: 12.5px;
      color: var(--subtext);
      margin: 4px 0;
    }
    .indicator {
      font-size: 21px;
      font-weight: 800;
      padding: 14px;
      border-radius: 8px;
      margin-top: 8px;
      background: #1e293b;
      color: #fbbf24;
      transition: background 0.15s, color 0.15s;
    }
    .indicator.aligned {
      background: #064e3b !important;
      color: var(--green) !important;
    }
    .indicator.below {
      background: #3b0764 !important;
      color: #d8b4fe !important;
    }
  </style>
</head>
<body>

  <h1>Localizador Messier (M1 - M110)</h1>

  <!-- Panel de inicio -->
  <div class="card" id="initPanel">
    <button id="btnInit">1. Activar Sensor y Audio</button>
    <div id="gpsStatus" class="readout" style="margin-top:6px;">GPS: Esperando activación...</div>
  </div>

  <!-- Selección de objeto con Nombre común -->
  <div class="card">
    <label for="messierSelect">Selecciona Objeto Messier:</label>
    <select id="messierSelect"></select>

    <!-- Configuración del montaje para corregir el ángulo de 90° -->
    <div style="margin-top: 10px; text-align: left;">
      <label for="mountMode">Posición física del móvil en el telescopio:</label>
      <select id="mountMode" style="font-size: 13px; padding: 6px;">
        <option value="perpendicular">Móvil de canto / vertical (Corrige desfase 90°)</option>
        <option value="flat">Móvil plano tumbado sobre el lomo del tubo</option>
      </select>
      <button id="btnZero" class="btn-secondary" style="margin-top: 6px;">Calibrar 0° en posición actual</button>
    </div>
  </div>

  <!-- Panel de coordenadas del objeto -->
  <div class="card">
    <label style="text-align:center;">COORDENADAS EN VIVO DEL OBJETO</label>
    <div class="coords-grid">
      <div class="coord-box">
        <div class="title">Rumbo Brújula (Azimut)</div>
        <div class="val" id="targetAz">--°</div>
      </div>
      <div class="coord-box">
        <div class="title">Ángulo Vertical (Altitud)</div>
        <div class="val" id="targetAlt">--°</div>
      </div>
    </div>

    <div class="readout">Elevación actual del tubo/móvil: <strong id="currentAlt" style="color:var(--text);">--°</strong></div>
    <div class="indicator" id="altIndicator">INCLINA EL TUBO</div>
  </div>

  <script>

      "M85": [12.423, 18.19, "Galaxia lenticular en Coma Berenices"],
      "M86": [12.435, 12.95, "Galaxia lenticular gigante en Virgo"],
      "M87": [12.513, 12.4, "Virgo A (Galaxia del agujero negro M87*)"],
      "M88": [12.533, 14.42, "Galaxia espiral regular en Coma"],
      "M89": [12.593, 12.56, "Galaxia elíptica esférica en Virgo"],
      "M90": [12.613, 13.16, "Galaxia espiral con corrimiento al azul"],

      "M92": [17.285, 43.14, "Segundo gran cúmulo en Hércules"],
      "M93": [7.743, -23.85, "Cúmulo abierto en Puppis"],
      "M94": [12.848, 41.12, "Galaxia del Ojo de Cocodrilo"],
      "M95": [10.733, 11.7, "Galaxia espiral anular en Leo"],
      "M96": [10.778, 11.82, "Galaxia espiral doble en Leo"],
      "M97": [11.247, 55.02, "Nebulosa del Búho"],
      "M98": [12.23, 14.9, "Galaxia espiral de canto en Coma"],
      "M99": [12.313, 14.42, "Galaxia del Molinillo de San José"],
      "M100": [12.382, 15.82, "Gran galaxia espiral en Coma"],
      "M101": [14.053, 54.35, "Galaxia del Molinillo"],
      "M102": [15.11, 55.76, "Galaxia del Huso (NGC 5866)"],
      "M103": [1.555, 60.7, "Cúmulo abierto en Casiopea"],
      "M104": [12.667, -11.62, "Galaxia del Sombrero"],
      "M105": [10.797, 12.58, "Galaxia elíptica en Leo"],
      "M106": [12.317, 47.3, "Galaxia espiral con brazos de emisión"],
      "M107": [16.542, -13.05, "Cúmulo globular en Ofiuco"],
      "M108": [11.192, 55.67, "Galaxia de la Tabla de Surf"],
      "M109": [11.96, 53.37, "Galaxia espiral aspiradora en Osa Mayor"],
      "M110": [0.673, 41.69, "Segunda galaxia satélite de Andrómeda"]

    // Población del desplegable con M# y Nombre
    const selectEl = document.getElementById('messierSelect');
    Object.keys(MESSIER).forEach(id => {
      const [ra, dec, name] = MESSIER[id];
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = `${id} — ${name}`;
      selectEl.appendChild(opt);
    });

    let userLat = 37.18; // Utrera
    let userLon = -5.78;
    let rawPhoneBeta = 0;
    let userOffset = 0;
    let audioCtx = null;
    let lastBeepTime = 0;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq, durMs) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (durMs / 1000));

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + (durMs / 1000));
      } catch (e) {}
    }

    // Botón de calibración manual a 0° (apuntar al horizonte y pulsar)
    document.getElementById('btnZero').addEventListener('click', () => {
      const mode = document.getElementById('mountMode').value;
      const baseAlt = (mode === 'perpendicular') ? (90 - rawPhoneBeta) : rawPhoneBeta;
      userOffset = baseAlt;
      alert(`Calibrado: Se toma la posición actual como horizonte 0° (Offset: ${userOffset.toFixed(1)}°)`);
    });

    document.getElementById('btnInit').addEventListener('click', async () => {
      initAudio();

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          p => {
            userLat = p.coords.latitude;
            userLon = p.coords.longitude;
            document.getElementById('gpsStatus').innerText = 
              `GPS OK: Lat ${userLat.toFixed(2)}°, Lon ${userLon.toFixed(2)}°`;
          },
          () => { document.getElementById('gpsStatus').innerText = 'GPS manual (37.18°, -5.78°)'; },
          { enableHighAccuracy: true }
        );
      }

      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm !== 'granted') return alert('Permiso denegado');
      }

      window.addEventListener('deviceorientation', e => {
        rawPhoneBeta = e.beta || 0;
      });

      document.getElementById('initPanel').style.display = 'none';
      setInterval(tick, 100);
    });

    function tick() {
      const id = selectEl.value;
      const [ra, dec] = MESSIER[id];
      const now = new Date();

      const obs = new Astronomy.Observer(userLat, userLon, 0);
      const hor = Astronomy.Horizon(now, obs, ra, dec, 'normal');

      const targetAlt = hor.altitude;
      const targetAz = hor.azimuth;

      // Cálculo de altitud del móvil aplicando corrección según soporte
      const mode = document.getElementById('mountMode').value;
      let calculatedPhoneAlt = (mode === 'perpendicular') ? (90 - rawPhoneBeta) : rawPhoneBeta;
      calculatedPhoneAlt -= userOffset;

      document.getElementById('targetAz').innerText = `${targetAz.toFixed(1)}°`;
      document.getElementById('targetAlt').innerText = `${targetAlt.toFixed(1)}°`;
      document.getElementById('currentAlt').innerText = `${calculatedPhoneAlt.toFixed(1)}°`;

      const altEl = document.getElementById('altIndicator');

      if (targetAlt < 0) {
        altEl.innerText = "BAJO EL HORIZONTE";
        altEl.className = "indicator below";
        return;
      }

      const dAlt = targetAlt - calculatedPhoneAlt;
      const absDAlt = Math.abs(dAlt);

      if (absDAlt < 1.0) {
        altEl.innerText = "¡ELEVACIÓN CENTRADA! ✓";
        altEl.className = "indicator aligned";
      } else if (dAlt > 0) {
        altEl.innerText = `SUBE ↑ (+${dAlt.toFixed(1)}°)`;
        altEl.className = "indicator";
      } else {
        altEl.innerText = `BAJA ↓ (${dAlt.toFixed(1)}°)`;
        altEl.className = "indicator";
      }

      // Audio continuo al centrar o pulsante al aproximarse
      const t = performance.now();
      if (absDAlt < 1.0) {
        if (t - lastBeepTime > 140) {
          playBeep(880, 130);
          lastBeepTime = t;
        }
      } else if (absDAlt < 8.0) {
        const interval = 120 + (absDAlt / 8.0) * 550;
        if (t - lastBeepTime > interval) {
          playBeep(520, 60);
          lastBeepTime = t;
        }
      }
    }
  </script>
</body>
</html>
