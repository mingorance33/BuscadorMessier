<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Localizador Celeste - Brújula iPhone</title>
  
  <!-- Motor de efemérides astronómicas de alta precisión -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

  <style>
    :root {
      --bg: #070b12;
      --card-bg: #0f1724;
      --border: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --orange: #f97316;
      --yellow: #facc15;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      color: var(--accent);
      font-size: 1.35rem;
      text-align: center;
      margin-bottom: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .btn-action {
      width: 100%;
      background: var(--accent);
      color: #031326;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .status-gps {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .label-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .btn-chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-chip.active {
      background: #0284c7;
      border-color: var(--accent);
      color: #fff;
    }

    select {
      width: 100%;
      background: #090d16;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px;
      font-size: 0.92rem;
      border-radius: 8px;
      outline: none;
    }

    optgroup {
      background: #0f1724;
      color: var(--accent);
      font-weight: 700;
    }

    option {
      background: #090d16;
      color: #fff;
    }

    .section-title {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .compass-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 14px auto;
    }

    .compass-dial {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #0b111e 60%, #070b12 100%);
      border: 2px solid #334155;
      box-shadow: 0 0 16px rgba(0,0,0,0.6);
      position: relative;
      transition: transform 0.1s linear;
    }

    .compass-tick {
      position: absolute;
      width: 2px;
      height: 10px;
      background: #475569;
      left: calc(50% - 1px);
      top: 6px;
      transform-origin: 50% 104px;
    }

    .compass-label {
      position: absolute;
      width: 20px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-align: center;
      left: calc(50% - 10px);
    }

    .compass-label.north { top: 22px; color: var(--red); }
    .compass-label.east { right: 22px; left: auto; top: calc(50% - 7px); }
    .compass-label.south { bottom: 22px; left: calc(50% - 10px); }
    .compass-label.west { left: 22px; top: calc(50% - 7px); }

    .compass-needle-fixed {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 14px solid var(--accent);
      z-index: 10;
    }

    .target-pointer {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      transform-origin: center center;
    }

    .target-dot {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: var(--orange);
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 10px var(--orange);
    }

    .compass-center-info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .heading-val {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .heading-unit {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .info-summary {
      display: flex;
      justify-content: space-around;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    .info-col-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .info-col-val {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--accent);
    }

    .info-col-val.target-color {
      color: var(--orange);
    }

    .target-banner {
      background: #111827;
      border: 1px solid #1f2937;
      color: var(--yellow);
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }

    .target-banner.aligned {
      background: #14532d;
      border-color: #22c55e;
      color: #86efac;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Localizador Celeste</h1>
    <div class="subtitle">Estrellas Guía, Planetas y Catálogo Messier</div>

    <div class="panel">
      <button class="btn-action" id="btn-activate" onclick="startApp()">Activar Brújula, Sensor y Audio</button>
      <div class="status-gps" id="gps-status">Esperando activación de sensores...</div>
    </div>

    <div class="panel">
      <div class="filter-row">
        <span class="label-title">Selecciona Objeto:</span>
        <button class="btn-chip active" id="filter-btn" onclick="toggleOnlyVisible()">Solo Visibles</button>
      </div>
      <select id="object-select" onchange="updateCalculations()"></select>
    </div>

    <div class="panel">
      <div class="section-title">Brújula en Vivo vs Objetivo</div>

      <div class="compass-wrapper">
        <div class="compass-needle-fixed"></div>

        <div class="compass-dial" id="compass-dial">
          <div class="compass-label north">N</div>
          <div class="compass-label east">E</div>
          <div class="compass-label south">S</div>
          <div class="compass-label west">O</div>

          <div class="target-pointer" id="target-pointer">
            <div class="target-dot" title="Posición del Objeto"></div>
          </div>
        </div>

        <div class="compass-center-info">
          <div class="heading-val" id="disp-heading">--°</div>
          <div class="heading-unit" id="disp-cardinal-dir">RUMBO</div>
        </div>
      </div>

      <div class="info-summary">
        <div>
          <div class="info-col-label">Objeto (Az / Alt)</div>
          <div class="info-col-val target-color" id="disp-target-coords">--° / --°</div>
        </div>
        <div>
          <div class="info-col-label">Inclinación Tubo</div>
          <div class="info-col-val" id="disp-sensor-pitch">--°</div>
        </div>
        <div>
          <div class="info-col-label">Giro Requerido</div>
          <div class="info-col-val" id="disp-turn">--°</div>
        </div>
      </div>

      <div class="target-banner" id="banner-status">ACTIVA SENSORES</div>
    </div>
  </div>

      { id: "M106", name: "Galaxia espiral", con: "CVn", ra: 12.316, dec: 47.30 },
      { id: "M107", name: "Cúmulo globular", con: "Oph", ra: 16.542, dec: -13.05 },
      { id: "M108", name: "Galaxia espiral", con: "UMa", ra: 11.192, dec: 55.67 },
      { id: "M109", name: "Galaxia espiral", con: "UMa", ra: 11.960, dec: 53.37 },
      { id: "M110", name: "Satélite de Andrómeda", con: "And", ra: 0.673, dec: 41.68 }
    ];

    let userLat = 37.18;
    let userLon = -5.78;
    let userElevation = 0;
    let onlyVisible = true;
    let currentAzTarget = null;
    let currentAltTarget = null;
    let currentCompassHeading = null;
    let currentSensorPitch = null;
    let audioCtx = null;
    let lastBeep = 0;

    // Cálculo unificado de coordenadas horizontales
    function getTargetAltAz(targetId, date, lat, lon, elev) {
      if (typeof Astronomy !== 'undefined') {
        const observer = new Astronomy.Observer(lat, lon, elev);

        // 1. Si es planeta o la Luna
        if (targetId.startsWith("PLANET_")) {
          const bodyKey = targetId.replace("PLANET_", "");
          const equ2000 = Astronomy.Equator(bodyKey, date, observer, true, true);
          const hor = Astronomy.Horizon(date, observer, equ2000.ra, equ2000.dec, 'normal');
          return { az: hor.azimuth, alt: hor.altitude };
        }

        // 2. Si es estrella brillante de calibración
        if (targetId.startsWith("STAR_")) {
          const star = BRIGHT_STARS_DATA.find(s => s.id === targetId);
          if (star) {
            const hor = Astronomy.Horizon(date, observer, star.ra, star.dec, 'normal');
            return { az: hor.azimuth, alt: hor.altitude };
          }
        }

        // 3. Si es objeto Messier
        const obj = MESSIER_DATA.find(o => o.id === targetId);
        if (obj) {
          const hor = Astronomy.Horizon(date, observer, obj.ra, obj.dec, 'normal');
          return { az: hor.azimuth, alt: hor.altitude };
        }
      } else {
        // Fallback básico si la CDN no ha terminado de cargar
        let item = BRIGHT_STARS_DATA.find(s => s.id === targetId) || MESSIER_DATA.find(o => o.id === targetId);
        if (!item) return { az: 0, alt: -90 };

        const d2r = Math.PI / 180, r2d = 180 / Math.PI;
        const jd = (date.getTime() / 86400000) + 2440587.5;
        const d = jd - 2451545.0;
        let gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
        let lst = ((gmst + (lon / 15.0)) % 24 + 24) % 24;
        let ha = (((lst - item.ra) * 15.0) % 360 + 360) % 360;
        let phi = lat * d2r, delta = item.dec * d2r, H = ha * d2r;
        let sinAlt = Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(H);
        let alt = Math.asin(sinAlt);
        let cosAz = (Math.sin(delta) - Math.sin(phi) * Math.sin(alt)) / (Math.cos(phi) * Math.cos(alt));
        let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) * r2d;
        if (Math.sin(H) > 0) az = 360 - az;
        return { az, alt: alt * r2d };
      }
      return { az: 0, alt: -90 };
    }

    function buildCompassTicks() {
      const dial = document.getElementById('compass-dial');
      for (let i = 0; i < 360; i += 30) {
        if (i % 90 === 0) continue;
        const tick = document.createElement('div');
        tick.className = 'compass-tick';
        tick.style.transform = `rotate(${i}deg)`;
        dial.appendChild(tick);
      }
    }

    function populateSelect() {
      const select = document.getElementById('object-select');
      const prevSelected = select.value;
      select.innerHTML = "";

      const now = new Date();

      // 1. Grupo Estrellas Principales (Guía / Calibración)
      const optgroupStars = document.createElement('optgroup');
      optgroupStars.label = "⭐ Estrellas Guía y Calibración";

      BRIGHT_STARS_DATA.forEach(star => {
        const { alt } = getTargetAltAz(star.id, now, userLat, userLon, userElevation);
        if (onlyVisible && alt <= 0) return;
        const opt = document.createElement('option');
        opt.value = star.id;
        opt.textContent = `${star.name} (${star.con}) (${alt > 0 ? '+' : ''}${alt.toFixed(0)}°)`;
        optgroupStars.appendChild(opt);
      });

      if (optgroupStars.children.length > 0) {
        select.appendChild(optgroupStars);
      }

      // 2. Grupo Planetas y Luna
      const optgroupPlanets = document.createElement('optgroup');
      optgroupPlanets.label = "🪐 Planetas y Luna";

      SOLAR_SYSTEM_DATA.forEach(p => {
        const { alt } = getTargetAltAz(p.id, now, userLat, userLon, userElevation);
        if (onlyVisible && alt <= 0) return;
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.name} (${alt > 0 ? '+' : ''}${alt.toFixed(0)}°)`;
        optgroupPlanets.appendChild(opt);
      });

      if (optgroupPlanets.children.length > 0) {
        select.appendChild(optgroupPlanets);
      }

      // 3. Grupo Catálogo Messier
      const optgroupMessier = document.createElement('optgroup');
      optgroupMessier.label = "🌌 Catálogo Messier";

      MESSIER_DATA.forEach(obj => {
        const { alt } = getTargetAltAz(obj.id, now, userLat, userLon, userElevation);
        if (onlyVisible && alt <= 0) return;
        const opt = document.createElement('option');
        opt.value = obj.id;
        opt.textContent = `${obj.id} — ${obj.name ? obj.name : obj.con} (${alt > 0 ? '+' : ''}${alt.toFixed(0)}°)`;
        optgroupMessier.appendChild(opt);
      });

      if (optgroupMessier.children.length > 0) {
        select.appendChild(optgroupMessier);
      }

      if (prevSelected && Array.from(select.options).some(o => o.value === prevSelected)) {
        select.value = prevSelected;
      }
      updateCalculations();
    }

    function toggleOnlyVisible() {
      onlyVisible = !onlyVisible;
      const btn = document.getElementById('filter-btn');
      btn.classList.toggle('active', onlyVisible);
      btn.textContent = onlyVisible ? "Solo Visibles" : "Mostrar Todos";
      populateSelect();
    }

    function updateCalculations() {
      const select = document.getElementById('object-select');
      if (!select.value) return;

      const now = new Date();
      const { az, alt } = getTargetAltAz(select.value, now, userLat, userLon, userElevation);

      currentAzTarget = az;
      currentAltTarget = alt;

      document.getElementById('disp-target-coords').textContent = `${az.toFixed(1)}° / ${alt.toFixed(1)}°`;

      const pointer = document.getElementById('target-pointer');
      pointer.style.transform = `rotate(${az}deg)`;

      checkAlignment();
    }

    function getCardinalLabel(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
      return dirs[Math.round(deg / 45) % 8];
    }

    function playBeep(freq, duration) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function checkAlignment() {
      const banner = document.getElementById('banner-status');
      if (currentAzTarget === null || currentAltTarget === null || currentCompassHeading === null || currentSensorPitch === null) {
        banner.textContent = "APUNTA EL IPHONE";
        banner.classList.remove('aligned');
        return;
      }

      let diffAz = (currentAzTarget - currentCompassHeading + 540) % 360 - 180;
      let diffAlt = currentAltTarget - currentSensorPitch;

      const absDiffAz = Math.abs(diffAz);
      const absDiffAlt = Math.abs(diffAlt);

      const turnLabel = diffAz > 0 ? `➔ Der ${absDiffAz.toFixed(1)}°` : `⬅ Izq ${absDiffAz.toFixed(1)}°`;
      document.getElementById('disp-turn').textContent = turnLabel;

      const now = Date.now();

      if (absDiffAz <= 2.5 && absDiffAlt <= 1.5) {
        banner.textContent = "¡EN EL BLANCO! (ALINEADO)";
        banner.classList.add('aligned');
        if (now - lastBeep > 250) {
          playBeep(880, 0.15);
          lastBeep = now;
        }
      } else {
        banner.classList.remove('aligned');
        let instructions = [];
        if (absDiffAz > 2.5) {
          instructions.push(diffAz > 0 ? `GIRA DERECHA (${absDiffAz.toFixed(1)}°)` : `GIRA IZQUIERDA (${absDiffAz.toFixed(1)}°)`);
        }
        if (absDiffAlt > 1.5) {
          instructions.push(diffAlt > 0 ? `SUBE (+${diffAlt.toFixed(1)}°)` : `BAJA (${diffAlt.toFixed(1)}°)`);
        }
        banner.textContent = instructions.join(" | ");

        const combinedDiff = Math.sqrt(absDiffAz * absDiffAz + absDiffAlt * absDiffAlt);
        if (combinedDiff < 10.0 && now - lastBeep > (combinedDiff * 70 + 80)) {
          playBeep(440, 0.05);
          lastBeep = now;
        }
      }
    }

    function handleOrientation(event) {
      let heading = null;
      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        heading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        heading = (360 - event.alpha) % 360;
      }

      if (heading !== null) {
        currentCompassHeading = heading;
        document.getElementById('disp-heading').textContent = `${Math.round(heading)}°`;
        document.getElementById('disp-cardinal-dir').textContent = getCardinalLabel(heading);
        document.getElementById('compass-dial').style.transform = `rotate(${-heading}deg)`;
      }

      if (event.beta !== null && event.beta !== undefined) {
        currentSensorPitch = event.beta;
        document.getElementById('disp-sensor-pitch').textContent = `${event.beta.toFixed(1)}°`;
      }

      checkAlignment();
    }

    function startApp() {
      const btn = document.getElementById('btn-activate');

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
              btn.textContent = "Brújula y Sensores Activos ✓";
              btn.style.background = "#22c55e";
            } else {
              alert("Permiso de orientación denegado.");
            }
          })
          .catch(err => {
            alert("Error al solicitar sensor: " + err);
          });
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
        btn.textContent = "Brújula y Sensores Activos ✓";
        btn.style.background = "#22c55e";
      }

      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
          userElevation = pos.coords.altitude || 0;
          document.getElementById('gps-status').textContent = 
            `Lat: ${userLat.toFixed(2)}°, Lon: ${userLon.toFixed(2)}° (GPS Activo)`;
          populateSelect();
        }, () => {
          document.getElementById('gps-status').textContent = 
            `Lat: ${userLat.toFixed(2)}°, Lon: ${userLon.toFixed(2)}° (Ubicación fija)`;
        });
      }
    }

    buildCompassTicks();
    populateSelect();
    setInterval(updateCalculations, 3000);
  </script>
</body>
</html>
